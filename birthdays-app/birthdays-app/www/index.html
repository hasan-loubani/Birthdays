<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر أعياد الميلاد</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10232a;--mute:#4f5f66;--line:rgba(16,35,42,.14);--glass:rgba(255,255,255,.5);--edge:rgba(255,255,255,.85);--shadow:0 16px 30px -16px rgba(16,35,42,.5);--field:rgba(16,35,42,.06);--p1:#efe7e0;--p2:#d9cbc1;--dlg:rgba(244,237,231,.94);--gt:#10232a;--gb:rgba(255,255,255,.55);--acc:#b58863;
--bg:radial-gradient(70% 30% at 50% 30%,rgba(181,136,99,.4),transparent 70%),linear-gradient(180deg,#e9dfd8,#b9aca4 60%,#8d9a9f)}
:root[data-theme=dark]{--ink:#f1e9e2;--mute:#b3aaa6;--line:rgba(255,255,255,.12);--glass:rgba(61,77,85,.38);--edge:rgba(255,255,255,.18);--shadow:0 18px 34px -16px #000;--field:rgba(255,255,255,.07);--p1:#1b282d;--p2:#141a1d;--dlg:rgba(22,30,34,.94);--gt:#f1e9e2;--gb:rgba(255,255,255,.1);
--bg:radial-gradient(70% 30% at 50% 36%,rgba(181,136,99,.38),transparent 70%),linear-gradient(180deg,#161616,#10232a)}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px 40px;background:var(--bg) fixed;color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.dev{max-width:980px;margin:0 auto;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 80px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.25)}
.hero{--gt:#f3ece6;--gb:rgba(255,255,255,.12);position:relative;color:#f3ece6;padding:26px 24px 74px;background:radial-gradient(60% 70% at 85% 0%,rgba(181,136,99,.45),transparent 70%),linear-gradient(180deg,#161616 0%,#10232a 55%,#3d4d55 100%)}
.hero h1{margin:0 0 14px;font-size:1.5rem;font-weight:800}
.wave{position:absolute;inset:auto 0 -1px 0;width:100%;height:60px;fill:var(--p1)}
.main{background:linear-gradient(var(--p1),var(--p2));padding:6px 24px 130px;min-height:360px}
/* glass buttons */
.btn{--gb:rgba(181,136,99,.88);--gt:#1b130d;position:relative;border:1px solid rgba(255,255,255,.4);color:var(--gt);padding:8px 18px;border-radius:999px;cursor:pointer;font-weight:700;
background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 55%,rgba(0,0,0,.1)),var(--gb);backdrop-filter:blur(14px) saturate(1.4);
box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -10px 14px -8px rgba(0,0,0,.28),0 10px 22px -12px rgba(0,0,0,.55);transition:transform .2s,box-shadow .2s}
.btn.ghost{--gb:var(--gb);--gt:var(--gt);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.03) 55%,rgba(0,0,0,.06)),var(--gb)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px) scale(.98)}
.btn.sm{padding:4px 14px;font-size:.88rem}.btn.del{color:#c0524d}
.fab{position:fixed;bottom:26px;left:50%;translate:-50% 0;width:70px;height:70px;padding:0;font-size:2.2rem;line-height:1;z-index:5}
.fab:hover{transform:translateY(-3px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{background:var(--glass);color:var(--ink);border:1px solid var(--edge);border-radius:999px;padding:8px 18px;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.hero .tools input{color:#f3ece6;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);width:100%}
.hero .tools input::placeholder{color:#c9bdb5}
.tools input{flex:1;min-width:160px}
.tools select option{color:#10232a}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filebar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:8px 16px;margin-bottom:14px;font-size:.88rem;backdrop-filter:blur(12px)}
.filebar span:last-child{display:flex;gap:6px;flex-wrap:wrap}
/* hero stage */
.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center}
.feat{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.24);border-radius:30px;padding:20px;backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 24px 40px -22px #000;display:grid;gap:10px}
.feat .fh{display:flex;gap:12px;align-items:center}
.feat small{color:#cfc3bb}
.fnum{display:flex;align-items:baseline;gap:8px}.fnum b{font-size:3.6rem;line-height:1;font-weight:800;color:#e3b78f}
.prog{height:6px;border-radius:9px;background:rgba(255,255,255,.15)}.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#b58863,#e8c29c)}
/* wheel */
.wheel{position:relative;height:300px;direction:ltr;overflow:hidden;touch-action:none;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);outline-offset:-4px}
.wheel::before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;border:1px solid rgba(255,255,255,.2);right:-540px;top:calc(50% - 300px)}
.wheel::after{content:"";position:absolute;right:30px;top:calc(50% - 5px);width:26px;height:10px;border-radius:9px;background:rgba(243,236,230,.75)}
.wi{position:absolute;right:76px;top:calc(50% - 28px);display:flex;align-items:center;gap:10px;direction:rtl;background:none;border:0;color:#f3ece6;cursor:pointer;transform-origin:right center;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s,filter .55s;white-space:nowrap}
.wa{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;border:1px solid rgba(255,255,255,.22);background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.wl{display:grid;text-align:right;font-weight:600}.wl small{color:#cfc3bb;font-weight:400}
.wi.on .wa{border-color:#e3b78f;background:rgba(181,136,99,.5);box-shadow:0 0 22px rgba(227,183,143,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.wi.on .wl{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 14px;background:rgba(255,255,255,.1)}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:28px;padding:16px;backdrop-filter:blur(14px);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.top{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.name{font-weight:800;font-size:1.05rem}.rel{font-size:.82rem;color:var(--mute)}
.when{margin:10px 0;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;gap:6px}
.badge{background:var(--field);border-radius:20px;padding:2px 12px;font-weight:600;white-space:nowrap}
.badge.soon{background:#b58863;color:#1b130d}.badge.today{background:#8fd0b8;color:#10232a}
.info{font-size:.9rem;color:var(--mute);margin:6px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tag{border:1px solid var(--line);border-radius:20px;padding:0 10px;font-size:.8rem}
.row{display:flex;gap:8px;margin-top:10px}
a.tel{color:var(--acc);font-weight:600;text-decoration:none;font-size:.9rem}
.alerts{margin:6px 0 12px}.alert{background:rgba(181,136,99,.25);border:1px solid var(--acc);border-radius:18px;padding:8px 16px;margin-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:2px dashed var(--line);border-radius:28px}
/* dialogs */
dialog{border:1px solid var(--edge);border-radius:30px;padding:0;width:min(520px,94vw);background:var(--dlg);color:var(--ink);backdrop-filter:blur(22px);box-shadow:0 40px 80px -30px #000}
dialog::backdrop{background:rgba(10,20,24,.6);backdrop-filter:blur(3px)}
form{padding:22px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;font-weight:600}
label input,label select,label textarea{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:400}
label select option{color:#10232a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt{display:grid;grid-template-columns:1fr 1.7fr 1.2fr;gap:6px}
.gi{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:7px 0}.gi small{color:var(--mute);text-align:left}
@media(max-width:700px){.stage{grid-template-columns:1fr}.two{grid-template-columns:1fr}.dev{border-radius:30px}.main{padding-inline:16px}body{padding:10px 8px 30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="dev">
<section class="hero">
  <h1>دفتر أعياد الميلاد</h1>
  <div class="tools"><input id="q" type="search" placeholder="ابحث بالاسم أو الاهتمامات..." aria-label="بحث"></div>
  <div class="stage"><div id="next"></div><div class="wheel" id="wh" tabindex="0" aria-label="الأقرب ميلاداً: حرّك بالعجلة أو الأسهم"></div></div>
  <svg class="wave" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80V34C200 -8 360 70 600 38S1000 -6 1200 30V80Z"/></svg>
</section>
<section class="main">
  <div class="alerts" id="alerts"></div>
  <div class="acts">
    <button class="btn ghost sm" id="th">◐ المظهر</button>
    <button class="btn ghost sm" id="nb">🔔 تفعيل الإشعارات</button>
    <button class="btn ghost sm" id="bk">نسخة احتياطية</button>
    <button class="btn ghost sm" id="rs">استرجاع</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <div class="filebar"><span id="fs">لم يتم اختيار ملف بيانات بعد</span>
    <span><button class="btn ghost sm" id="fo">📂 اختيار ملف البيانات</button>
    <button class="btn ghost sm" id="fn">📄 ملف جديد</button>
    <button class="btn sm" id="fc" hidden>🔗 إعادة الاتصال بالملف</button></span></div>
  <div class="tools">
    <select id="fr"><option value="">كل الصلات</option></select>
    <select id="so"><option value="soon">الأقرب أولاً</option><option value="name">حسب الاسم</option></select>
  </div>
  <div class="grid" id="list"></div>
</section>
<button class="btn fab" id="add" aria-label="إضافة شخص" title="إضافة شخص">+</button>
</main>

<dialog id="dlg">
<form id="f" method="dialog">
  <h2 id="ft" style="margin:0">إضافة شخص</h2>
  <label>الاسم *<input id="n" required></label>
  <div class="two">
    <label>تاريخ الميلاد *<div class="dt"><select id="dd" required></select><select id="dm" required></select><select id="dy" required></select></div></label>
    <label>رقم الهاتف<input id="p" type="tel" inputmode="tel" dir="ltr" style="text-align:right"></label>
  </div>
  <div class="two">
    <label>صلة القرابة<select id="r"></select></label>
    <label>التذكير قبل الميلاد
      <select id="rm">
        <option value="-1">بدون تذكير</option><option value="0">في اليوم نفسه</option>
        <option value="1">قبل يوم</option><option value="3">قبل 3 أيام</option>
        <option value="7" selected>قبل أسبوع</option><option value="14">قبل أسبوعين</option>
        <option value="30">قبل شهر</option>
      </select>
    </label>
  </div>
  <label>معلومات عنه<textarea id="i" rows="3" placeholder="عمله، مكان سكنه، ملاحظات تهمك..."></textarea></label>
  <label>الاهتمامات (افصل بينها بفاصلة)<input id="t" placeholder="كرة القدم، القهوة، السفر"></label>
  <div class="row" style="justify-content:flex-end">
    <button type="button" class="btn ghost" id="cx">إلغاء</button>
    <button class="btn" id="sv" value="ok">حفظ</button>
  </div>
</form>
</dialog>

<dialog id="gd"><div style="padding:20px;display:grid;gap:10px">
  <h2 id="gt" style="margin:0"></h2>
  <div id="gb"></div>
  <div class="row" style="justify-content:flex-end;flex-wrap:wrap">
    <button class="btn ghost sm" id="gc">📋 نسخ طلب للذكاء الاصطناعي</button>
    <button class="btn ghost sm" id="gr">🔄 اقتراحات أخرى</button>
    <button class="btn sm" id="gx">إغلاق</button></div>
</div></dialog>

<script>
const RELS=['أب','أم','أخ','أخت','ابن','ابنة','زوج/زوجة','جد','جدة','عم','عمة','خال','خالة','ابن عم/عمة','ابن خال/خالة','صديق','زميل عمل','جار','أخرى'];
const COLORS=['#9a6f4a','#3d4d55','#6f7f86','#10232a','#7d5a3c','#4f6670'];
const KEY='birthdays_v1';
let people=[],editId=null;
const $=id=>document.getElementById(id);

function load(){try{people=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){people=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}writeFile()}

function daysLeft(ds){
  const t=new Date();t.setHours(0,0,0,0);
  const [y,m,d]=ds.split('-').map(Number);
  let nx=new Date(t.getFullYear(),m-1,d);
  if(nx<t)nx=new Date(t.getFullYear()+1,m-1,d);
  const age=nx.getFullYear()-y;
  return {days:Math.round((nx-t)/864e5),age,date:nx};
}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.toLocaleDateString('ar',{day:'numeric',month:'long'});
const label=n=>n===0?'اليوم 🎉':n===1?'غداً':n===2?'بعد يومين':`بعد ${n} يوم`;

function render(){
  const q=$('q').value.trim().toLowerCase(),fr=$('fr').value,so=$('so').value;
  let arr=people.map(p=>({...p,...daysLeft(p.date)}));
  const all=[...arr].sort((a,b)=>a.days-b.days);

  // أقرب مناسبة
  hero(all);

  // التذكيرات
  const due=all.filter(p=>p.remind>=0&&p.days<=p.remind);
  document.title=(due.length?'('+due.length+') 🎂 ':'')+'دفتر أعياد الميلاد';
  $('alerts').innerHTML=due.map(p=>`<div class="alert">🔔 ${p.days===0?'اليوم':'بعد '+p.days+' يوم'} عيد ميلاد <b>${esc(p.name)}</b> (${esc(p.rel)})</div>`).join('');

  arr=arr.filter(p=>(!fr||p.rel===fr)&&(!q||(p.name+' '+p.tags.join(' ')+' '+p.info).toLowerCase().includes(q)));
  arr.sort((a,b)=>so==='name'?a.name.localeCompare(b.name,'ar'):a.days-b.days);

  $('list').innerHTML=arr.length?arr.map(p=>{
    const cls=p.days===0?'today':p.days<=7?'soon':'';
    return `<div class="card">
      <div class="top"><div class="av" style="background:${COLORS[p.name.length%6]}">${esc(p.name[0])}</div>
        <div><div class="name">${esc(p.name)}</div><div class="rel">${esc(p.rel)}</div></div></div>
      <div class="when"><span>${fmt(p.date)} • ${p.age} سنة</span><span class="badge ${cls}">${label(p.days)}</span></div>
      ${p.phone?`<a class="tel" dir="ltr" href="tel:${esc(p.phone)}">📞 ${esc(p.phone)}</a>`:''}
      ${p.info?`<div class="info">${esc(p.info)}</div>`:''}
      ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      <div class="rel">${p.remind>=0?'🔔 تذكير: '+(p.remind===0?'في اليوم نفسه':'قبل '+p.remind+' يوم'):'🔕 بدون تذكير'}</div>
      <div class="row"><button class="btn sm ${p.days<=30?'':'ghost'}" onclick="gift('${p.id}')">🎁 اقتراح هدية</button><button class="btn ghost sm" onclick="edit('${p.id}')">تعديل</button>
      <button class="btn ghost sm del" onclick="del('${p.id}')">حذف</button></div></div>`}).join('')
    :`<div class="empty" style="grid-column:1/-1">${people.length?'لا توجد نتائج مطابقة.':'لم تضف أحداً بعد. اضغط «إضافة شخص» لتبدأ.'}</div>`;

  // فلتر الصلات
  const cur=$('fr').value,used=[...new Set(people.map(p=>p.rel))];
  $('fr').innerHTML='<option value="">كل الصلات</option>'+used.map(r=>`<option ${r===cur?'selected':''}>${esc(r)}</option>`).join('');
}

function openForm(p){
  editId=p?p.id:null;
  $('ft').textContent=p?'تعديل البيانات':'إضافة شخص';
  $('n').value=p?.name||'';setDate(p?.date||'');$('p').value=p?.phone||'';
  $('r').value=p?.rel||RELS[0];$('rm').value=p?p.remind:7;
  $('i').value=p?.info||'';$('t').value=p?p.tags.join('، '):'';
  $('dlg').showModal();
}
function edit(id){openForm(people.find(p=>p.id===id))}
function del(id){if(confirm('هل تريد حذف هذا الشخص؟')){people=people.filter(p=>p.id!==id);save();render()}}

$('f').addEventListener('submit',e=>{
  const dt=getDate(),[yy,mm,d2]=dt.split('-').map(Number);
  if(!dt||new Date(yy,mm-1,d2).getMonth()!==mm-1){e.preventDefault();alert('تاريخ الميلاد غير صحيح، تأكد من اليوم والشهر.');return}
  const o={id:editId||Date.now()+'',name:$('n').value.trim(),date:getDate(),phone:$('p').value.trim(),
    rel:$('r').value,remind:+$('rm').value,info:$('i').value.trim(),
    tags:$('t').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean)};
  if(editId)people=people.map(p=>p.id===editId?o:p);else people.push(o);
  save();render();
  if(o.remind>=0&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission();
});
$('add').onclick=()=>openForm();
$('cx').onclick=()=>$('dlg').close();
['q','fr','so'].forEach(i=>$(i).addEventListener('input',render));

// نسخة احتياطية
$('bk').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(people,null,1)],{type:'application/json'}));
  a.download='birthdays-backup.json';a.click();
};
$('rs').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)&&confirm('سيتم استبدال البيانات الحالية. متابعة؟')){people=d;save();render()}}catch(x){alert('الملف غير صالح')}};
  r.readAsText(f);e.target.value='';
};

// ===== الإشعارات =====
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function fillDate(){
  const opt=(v,t)=>`<option value="${v}">${t}</option>`;
  $('dd').innerHTML=opt('','اليوم')+Array.from({length:31},(_,i)=>opt(i+1,i+1)).join('');
  $('dm').innerHTML=opt('','الشهر')+MONTHS.map((m,i)=>opt(i+1,m)).join('');
  const y=new Date().getFullYear();
  $('dy').innerHTML=opt('','السنة')+Array.from({length:y-1919},(_,i)=>opt(y-i,y-i)).join('');
}
function getDate(){const d=$('dd').value,m=$('dm').value,y=$('dy').value;return d&&m&&y?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:''}
function setDate(v){const [y,m,d]=v?v.split('-').map(Number):['','',''];$('dy').value=y;$('dm').value=m;$('dd').value=d}
fillDate();

function sendNote(title,body){try{new Notification(title,{body});return true}catch(e){return false}}
function notify(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const today=new Date().toDateString();let seen={};
  try{seen=JSON.parse(localStorage.getItem('notified')||'{}')}catch(e){}
  people.forEach(p=>{const {days}=daysLeft(p.date);
    if(p.remind>=0&&days<=p.remind&&seen[p.id]!==today){
      if(sendNote('🎂 تذكير عيد ميلاد',`${p.name}: ${days===0?'اليوم':'بعد '+days+' يوم'}`))seen[p.id]=today}});
  try{localStorage.setItem('notified',JSON.stringify(seen))}catch(e){}
}
function nbUpdate(){
  const b=$('nb');
  if(!('Notification' in window)){b.textContent='🔕 الإشعارات غير مدعومة';return}
  const pm=Notification.permission;
  b.textContent=pm==='granted'?'🔔 تجربة إشعار':pm==='denied'?'🔕 الإشعارات محظورة':'🔔 تفعيل الإشعارات';
}
$('nb').onclick=async()=>{
  if(!('Notification' in window)){alert('هذا المتصفح لا يدعم الإشعارات. ستظهر التذكيرات داخل الصفحة وفي عنوان التبويب.');return}
  if(Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  nbUpdate();
  if(Notification.permission==='granted'){
    if(sendNote('🎂 دفتر أعياد الميلاد','الإشعارات تعمل بنجاح!'))notify();
    else alert('تعذّر إظهار الإشعار. تأكد من إعدادات الإشعارات في نظام التشغيل (وضع عدم الإزعاج).');
  }else if(Notification.permission==='denied'){
    alert('الإشعارات محظورة لهذه الصفحة.\nافتح إعدادات الموقع من أيقونة القفل بجانب العنوان وفعّل «الإشعارات».\nإذا فتحت الملف مباشرة من الجهاز (file://) فقد يمنعها المتصفح؛ في هذه الحالة تظهر التذكيرات داخل الصفحة وفي عنوان التبويب.');
  }
};
nbUpdate();setInterval(notify,60000);

// ===== الحفظ في ملف على الجهاز =====
const FSA='showOpenFilePicker' in window&&'showSaveFilePicker' in window;
let fh=null,linked=false;
const OPTS={types:[{description:'بيانات أعياد الميلاد',accept:{'application/json':['.json']}}]};
const setStatus=t=>{$('fs').textContent=t};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bdays',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function hGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get('fh');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function hSet(h){try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(h,'fh')}catch(e){}}
async function writeFile(){
  if(!fh||!linked)return;
  try{const w=await fh.createWritable();await w.write(JSON.stringify(people,null,1));await w.close();setStatus('✅ البيانات محفوظة في الملف: '+fh.name)}
  catch(e){linked=false;$('fc').hidden=false;setStatus('⚠️ تعذّر الحفظ في الملف. اضغط «إعادة الاتصال».')}
}
async function readFile(){
  const t=await(await fh.getFile()).text();
  if(t.trim()){const d=JSON.parse(t);if(!Array.isArray(d))throw 0;people=d;try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
  linked=true;$('fc').hidden=true;render();notify();
  if(!t.trim())await writeFile();else setStatus('✅ تم تحميل البيانات من الملف: '+fh.name);
}
async function openExisting(){
  try{[fh]=await showOpenFilePicker(OPTS);await hSet(fh);await readFile()}
  catch(e){if(e.name!=='AbortError')alert('تعذّرت قراءة الملف. تأكد أنه ملف بيانات صالح.')}
}
async function createNew(){
  try{fh=await showSaveFilePicker({...OPTS,suggestedName:'birthdays-data.json'});await hSet(fh);linked=true;$('fc').hidden=true;await writeFile()}
  catch(e){}
}
async function reconnect(){
  try{if(await fh.requestPermission({mode:'readwrite'})==='granted')await readFile()}
  catch(e){alert('تعذّر الاتصال بالملف. اختره من جديد.')}
}
async function initFile(){
  if(!FSA){$('fo').hidden=$('fn').hidden=true;setStatus('متصفحك لا يدعم الحفظ التلقائي في ملف. استخدم «نسخة احتياطية» و«استرجاع».');return}
  $('fo').onclick=openExisting;$('fn').onclick=createNew;$('fc').onclick=reconnect;
  fh=await hGet();if(!fh)return;
  try{
    if(await fh.queryPermission({mode:'readwrite'})==='granted')await readFile();
    else{$('fc').hidden=false;setStatus('الملف المحفوظ سابقاً: '+fh.name+' — اضغط «إعادة الاتصال» لتحميل بياناتك.')}
  }catch(e){$('fc').hidden=false;setStatus('اضغط «إعادة الاتصال» لتحميل بياناتك من الملف.')}
}

// ===== اقتراح الهدايا =====
const GI=[
{k:['كرة','قدم','رياضة','جري','ركض','جيم','لياقة','سباحة','تنس','دراجة'],g:['حذاء رياضي مريح','ساعة رياضية ذكية','حقيبة رياضية','قميص فريقه المفضل','اشتراك في نادٍ أو بطولة','زجاجة مياه حرارية']},
{k:['قهوة','شاي'],g:['مجموعة قهوة مختصة','مطحنة أو مكبس قهوة','كوب حراري أنيق','صندوق شاي فاخر']},
{k:['سفر','رحلات','سياحة','تخييم','مغامر'],g:['حقيبة سفر عملية','منظّم أغراض السفر','شاحن متنقل','كتاب دليل لوجهته القادمة','مستلزمات تخييم']},
{k:['قراءة','كتب','رواية','أدب','شعر'],g:['رواية من مؤلفه المفضل','قارئ كتب إلكتروني','مصباح قراءة','اشتراك كتب صوتية']},
{k:['طبخ','مطبخ','حلويات','خبز'],g:['أدوات مطبخ احترافية','قلاية هوائية','كتاب وصفات','طقم سكاكين جيد','مجموعة توابل فاخرة']},
{k:['تصوير','كاميرا','فوتوغراف'],g:['حامل كاميرا ثلاثي','حقيبة كاميرا وبطاقة ذاكرة','طابعة صور صغيرة','عدسة مناسبة لكاميرته']},
{k:['ألعاب','العاب','قيمز','بلايستيشن','gaming'],g:['بطاقة شحن ألعاب','يد تحكم إضافية','سماعة ألعاب','كرسي ألعاب مريح','لعبة جديدة يرغب بها']},
{k:['موسيقى','غناء','عزف','جيتار','بيانو'],g:['سماعات رأس جيدة','سماعة بلوتوث','اشتراك موسيقى','ملحقات لآلته الموسيقية']},
{k:['تقنية','برمجة','حاسوب','كمبيوتر','جوال','تكنولوجيا'],g:['لوحة مفاتيح أو ماوس مميز','قرص تخزين سريع','حامل لابتوب','سماعات عازلة للضوضاء','ساعة ذكية']},
{k:['رسم','فن','تلوين','خط','يدوي'],g:['أدوات رسم احترافية','دفتر رسم فاخر','مجموعة خطوط وأقلام','لوحة جاهزة للتلوين']},
{k:['سيارات','سيارة','قيادة'],g:['حامل جوال للسيارة','مجموعة عناية بالسيارة','كاميرا أمامية للسيارة','غسيل وتلميع احترافي']},
{k:['نباتات','حديقة','زراعة','زهور'],g:['نبتة داخلية مع أصيص جميل','أدوات زراعة','بذور نادرة','نظام سقاية ذكي']},
{k:['عطور','عطر','موضة','أزياء','ملابس'],g:['عطر بنفحته المفضلة','حقيبة أو محفظة جلدية','وشاح أو ساعة أنيقة','قسيمة شراء من متجره المفضل']},
{k:['دمى','ليغو','تركيب','كرتون'],g:['مجموعة تركيب (ليغو)','أحجية','لعبة تعليمية','مجسّم لشخصيته الكرتونية المفضلة']},
{k:['ديكور','منزل','تصميم'],g:['إكسسوار ديكور','شموع معطرة','إطار بصورة جميلة']},
{k:['صيد','بحر','بر'],g:['معدات صيد','كشاف قوي','كرسي رحلات قابل للطي']},
{k:['أفلام','سينما','مسلسلات'],g:['تذاكر سينما','اشتراك منصة أفلام','جهاز عرض صغير','صندوق فشار وأكواب سينما']},
{k:['صحة','يوغا','تأمل','عناية'],g:['بساط يوغا','جهاز مساج صغير','مجموعة عناية بالبشرة','جلسة سبا']}
];
const GA=[
[0,5,['لعبة تعليمية آمنة','قصص مصوّرة','ملابس أو حذاء مريح']],
[6,12,['مجموعة تركيب','دراجة أو سكوتر مع واقيات','كتب مصوّرة مشوّقة','أدوات رسم وتلوين','لعبة جماعية']],
[13,17,['سماعات أو إكسسوار للجوال','بطاقة شحن ألعاب','حقيبة أو ملابس عصرية','دفتر وأقلام مميزة']],
[18,29,['سماعات لاسلكية','حقيبة ظهر عصرية','عطر','اشتراك منصة ترفيه','تجربة (رحلة أو حفل)']],
[30,49,['ساعة أنيقة','محفظة أو حقيبة جلدية','عشاء أو رحلة قصيرة','جهاز منزلي مفيد']],
[50,64,['قلم أو ساعة فاخرة','جهاز مساج','طقم قهوة أو شاي فاخر','إطار صور عائلية','تجربة سفر هادئة']],
[65,200,['مصحف أو مسبحة فاخرة','بطانية أو وسادة مريحة','جهاز قياس ضغط منزلي','ألبوم صور عائلية','تمور أو عسل فاخر']]
];
const MALE=['عطر أو عود فاخر','ثوب أو قميص أنيق','عشاء عائلي مميز'];
const FEM=['عطر أو بخور فاخر','وشاح أو عباءة أنيقة','باقة ورد مع عشاء عائلي'];
const GR={'أب':MALE,'جد':MALE,'عم':MALE,'خال':MALE,'أم':FEM,'جدة':FEM,'عمة':FEM,'خالة':FEM,
'زوج':['هدية رومانسية مع رسالة بخط يدك','عطر','عشاء أو رحلة لشخصين','ساعة أو مجوهرات'],
'صديق':['هدية رمزية تذكّر بموقف مشترك','تجربة تجمعكما (طعام أو نشاط)','لعبة لوحية للقاءاتكم'],
'زميل':['مفكرة وقلم أنيق','كوب حراري','علبة شوكولاتة','مجموعة قهوة','بطاقة تهنئة'],
'جار':['علبة حلويات أو تمور','نبتة صغيرة','بطاقة تهنئة لطيفة'],
'ابن':['هدية مرتبطة بحلمه أو هوايته','وقت خاص معك (رحلة أو نشاط)'],
'أخ':['هدية تذكّر بطفولتكما','تجربة تجمعكما']};
const GD=['هدية رمزية مع بطاقة تهنئة','علبة حلويات فاخرة','باقة ورد'];
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
let curGift=null;
function relGifts(rel){
  const k=Object.keys(GR).find(k=>rel.includes(k));
  return k?GR[k]:GD;
}
function suggest(p){
  const hay=(p.tags.join(' ')+' '+p.info).toLowerCase(),seen=new Set(),out=[];
  const add=(g,why)=>{if(!seen.has(g)){seen.add(g);out.push({g,why})}};
  const ints=[];
  GI.forEach(c=>{const hit=c.k.find(k=>hay.includes(k));if(hit)ints.push([c,hit])});
  pick(ints,4).forEach(([c,hit])=>pick(c.g,2).forEach(g=>add(g,'لاهتمامه بـ «'+hit+'»')));
  const ag=GA.find(a=>p.age>=a[0]&&p.age<=a[1]);
  if(ag)pick(ag[2],3).forEach(g=>add(g,'يناسب عمر '+p.age+' سنة'));
  pick(relGifts(p.rel),2).forEach(g=>add(g,'يناسب صلة: '+p.rel));
  return {out,hasInt:ints.length>0};
}
function gift(id){
  const p=people.map(x=>({...x,...daysLeft(x.date)})).find(x=>x.id===id);if(!p)return;
  curGift=id;
  const {out,hasInt}=suggest(p);
  $('gt').textContent='🎁 هدية لـ '+p.name;
  $('gb').innerHTML=
    `<div class="rel" style="margin-bottom:6px">${esc(p.rel)} • سيبلغ ${p.age} سنة ${label(p.days)}</div>`+
    out.map(o=>`<div class="gi"><span>${esc(o.g)}</span><small>${esc(o.why)}</small></div>`).join('')+
    (hasInt?'':'<p class="info">💡 أضف اهتماماته أو معلومات عنه (من «تعديل») لتحصل على اقتراحات أدق.</p>')+
    (p.days<=3?'<p class="info">⏰ الموعد قريب جداً، فضّل ما يتوفر فوراً من المتاجر.</p>':'');
  if(!$('gd').open)$('gd').showModal();
}
$('gr').onclick=()=>gift(curGift);
$('gx').onclick=()=>$('gd').close();
$('gc').onclick=async()=>{
  const p=people.map(x=>({...x,...daysLeft(x.date)})).find(x=>x.id===curGift);if(!p)return;
  const t=`اقترح علي 8 أفكار هدايا مناسبة لعيد ميلاد ${p.name} (${p.rel})، وسيبلغ ${p.age} سنة.\nاهتماماته: ${p.tags.join('، ')||'غير محددة'}\nمعلومات عنه: ${p.info||'لا توجد'}\nاذكر لكل هدية سبب مناسبتها وسعراً تقريبياً، ورتّبها من الأرخص إلى الأغلى.`;
  try{await navigator.clipboard.writeText(t);alert('تم النسخ. الصقه في Claude أو أي مساعد ذكاء اصطناعي.')}
  catch(e){prompt('انسخ النص:',t)}
};

// ===== الواجهة: العجلة والبطاقة المميزة والمظهر =====
let sel=0,lastAll=[],wsig='';
function hero(all){
  lastAll=all;if(sel>=all.length)sel=Math.max(0,all.length-1);
  const p=all[sel];
  $('wh').hidden=!p;
  if(!p){$('next').innerHTML='<div class="feat"><b>ابدأ بإضافة أول شخص</b><small>اضغط زر + في الأسفل</small></div>';return}
  const pct=Math.round((365-p.days)/365*100);
  $('next').innerHTML=`<div class="feat"><div class="fh"><div class="av" style="background:${COLORS[p.name.length%6]}">${esc(p.name[0])}</div>
    <div><b>${esc(p.name)}</b><br><small>${esc(p.rel)} • ${fmt(p.date)}</small></div></div>
    <div class="fnum"><b>${p.days}</b><span>${p.days===0?'اليوم! 🎉':'يوم متبقٍ'}</span></div>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <small>سيبلغ ${p.age} سنة</small>
    <div class="row"><button class="btn sm" onclick="gift('${p.id}')">🎁 اقتراح هدية</button><button class="btn ghost sm" onclick="edit('${p.id}')">تعديل</button></div></div>`;
  const sig=all.map(x=>x.id+x.name+x.days).join();
  if(sig!==wsig){wsig=sig;$('wh').innerHTML=all.map((q,k)=>`<button class="wi" data-k="${k}" tabindex="-1"><span class="wa">${esc(q.name[0])}</span><span class="wl">${esc(q.name)}<small>${label(q.days)}</small></span></button>`).join('')}
  placeWheel();
}
function placeWheel(){
  document.querySelectorAll('.wi').forEach(el=>{
    const i=+el.dataset.k-sel,a=Math.abs(i),dy=Math.max(-290,Math.min(290,i*60)),dx=300-Math.sqrt(300*300-dy*dy);
    el.className='wi'+(i===0?' on':'');
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${i*-3}deg) scale(${1-Math.min(a,4)*.07})`;
    el.style.opacity=a>3?0:1-a*.28;el.style.filter=`blur(${Math.min(a,4)*1.3}px)`;el.style.pointerEvents=a>3?'none':'auto';
  });
}
const mv=d=>{if(!lastAll.length)return;sel=Math.min(lastAll.length-1,Math.max(0,sel+d));hero(lastAll)};
const wh=$('wh');let y0=null;
wh.addEventListener('wheel',e=>{e.preventDefault();mv(e.deltaY>0?1:-1)},{passive:false});
wh.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();mv(1)}if(e.key==='ArrowUp'){e.preventDefault();mv(-1)}});
wh.addEventListener('click',e=>{const b=e.target.closest('.wi');if(b){sel=+b.dataset.k;hero(lastAll)}});
wh.addEventListener('pointerdown',e=>{y0=e.clientY});
wh.addEventListener('pointermove',e=>{if(y0!==null&&Math.abs(e.clientY-y0)>40){mv(e.clientY<y0?1:-1);y0=e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(t=>wh.addEventListener(t,()=>{y0=null}));
$('th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};

$('r').innerHTML=RELS.map(r=>`<option>${r}</option>`).join('');
load();render();notify();initFile();
</script>
